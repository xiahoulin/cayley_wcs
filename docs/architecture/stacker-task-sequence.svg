<text x="20" y="918" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">9</text>
<rect x="1093.5" y="930" width="383" height="34" rx="4" fill="#ffffff"/>
<text x="1285" y="959" font-size="29" fill="#2e537d" font-weight="400" text-anchor="middle">回读命令区任务号并核对 N</text>
