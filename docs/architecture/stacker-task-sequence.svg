<text x="20" y="728" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">7</text>
<rect x="22" y="751" width="1556" height="34" rx="5" fill="#eaf0f6"/>
<text x="42" y="777" font-size="28" fill="#37516e" font-weight="700" text-anchor="start">03  参数写入与执行握手</text>
<rect x="736" y="797" width="438" height="34" rx="4" fill="#ffffff"/>
<text x="955" y="826" font-size="29" fill="#2e537d" font-weight="400" text-anchor="middle">保存参数写入前的任务版本占位</text>
<line x1="1120" y1="841" x2="790" y2="841" stroke="#2e537d" stroke-width="2.7"  marker-end="url(#blue)"/>
<text x="20" y="848" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">8</text>
<rect x="1026" y="867" width="518" height="34" rx="4" fill="#ffffff"/>
<text x="1285" y="896" font-size="29" fill="#2e537d" font-weight="400" text-anchor="middle">依次写坐标、货口、任务号 N、任务类型</text>
