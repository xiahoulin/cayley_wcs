<rect x="1021" y="1196" width="528" height="34" rx="4" fill="#ffffff"/>
<text x="1285" y="1225" font-size="29" fill="#2e537d" font-weight="400" text-anchor="middle">执行中置确认点0，轮询任务状态等完成</text>
<line x1="1120" y1="1240" x2="1450" y2="1240" stroke="#2e537d" stroke-width="2.7"  marker-end="url(#blue)"/>
<text x="20" y="1247" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">14</text>
<rect x="1033" y="1259" width="504" height="34" rx="4" fill="#ffffff"/>
<text x="1285" y="1288" font-size="29" fill="#237d87" font-weight="400" text-anchor="middle">设备完成：任务状态 status_Task=2</text>
<line x1="1450" y1="1303" x2="1120" y2="1303" stroke="#237d87" stroke-width="2.7" stroke-dasharray="8 5" marker-end="url(#teal)"/>
<text x="20" y="1310" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">15</text>
<rect x="22" y="1333" width="1556" height="34" rx="5" fill="#eaf0f6"/>
<text x="42" y="1359" font-size="28" fill="#37516e" font-weight="700" text-anchor="start">04  结果保存、完成确认与终态通知</text>
<rect x="1058" y="1379" width="454" height="34" rx="4" fill="#ffffff"/>
<text x="1285" y="1408" font-size="29" fill="#2e537d" font-weight="400" text-anchor="middle">采集、验证响应点位及反馈任务号</text>
<line x1="1120" y1="1423" x2="1450" y2="1423" stroke="#2e537d" stroke-width="2.7"  marker-end="url(#blue)"/>
<text x="20" y="1430" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">16</text>
<rect x="752.5" y="1442" width="405" height="34" rx="4" fill="#ffffff"/>
<text x="955" y="1471" font-size="29" fill="#d97016" font-weight="600" text-anchor="middle">先持久保存采集结果 result</text>
<line x1="1120" y1="1486" x2="790" y2="1486" stroke="#d97016" stroke-width="2.7"  marker-end="url(#orange)"/>
<text x="20" y="1493" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">17</text>
<rect x="1052.5" y="1505" width="465" height="34" rx="4" fill="#ffffff"/>
<text x="1285" y="1534" font-size="29" fill="#d97016" font-weight="600" text-anchor="middle">完成确认点 cmd_ConfirmTask=2</text>
<line x1="1120" y1="1549" x2="1450" y2="1549" stroke="#d97016" stroke-width="2.7"  marker-end="url(#orange)"/>
<text x="20" y="1556" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">18</text>
<rect x="1013" y="1575" width="544" height="34" rx="4" fill="#ffffff"/>
<text x="1285" y="1604" font-size="29" fill="#2e537d" font-weight="400" text-anchor="middle">补发确认2并清零，回读任务状态0后完成</text>
<line x1="1120" y1="1619" x2="1450" y2="1619" stroke="#2e537d" stroke-width="2.7"  marker-end="url(#blue)"/>
<text x="20" y="1626" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">19</text>
<rect x="648" y="1638" width="614" height="34" rx="4" fill="#ffffff"/>
<text x="955" y="1667" font-size="29" fill="#2e537d" font-weight="400" text-anchor="middle">保存已完成状态 completed；释放任务号占用</text>
<line x1="1120" y1="1682" x2="790" y2="1682" stroke="#2e537d" stroke-width="2.7"  marker-end="url(#blue)"/>
<text x="20" y="1689" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">20</text>
<rect x="390.5" y="1701" width="454" height="34" rx="4" fill="#ffffff"/>
<text x="617.5" y="1730" font-size="29" fill="#2e537d" font-weight="400" text-anchor="middle">读取持久结果；扫描回调投递待办</text>
<line x1="445" y1="1745" x2="790" y2="1745" stroke="#2e537d" stroke-width="2.7"  marker-end="url(#blue)"/>
<text x="20" y="1752" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">21</text>
<rect x="50" y="1764" width="495" height="34" rx="4" fill="#ffffff"/>
<text x="297.5" y="1793" font-size="29" fill="#237d87" font-weight="400" text-anchor="middle">查询响应或签名 Webhook 通知终态</text>
<line x1="445" y1="1808" x2="150" y2="1808" stroke="#237d87" stroke-width="2.7" stroke-dasharray="8 5" marker-end="url(#teal)"/>
<text x="20" y="1815" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">22</text>
<rect x="30" y="1900" width="1540" height="77" rx="8" fill="#f2f6fa"/>
<text x="60" y="1930" font-size="27" fill="#475c73" font-weight="400" text-anchor="start">业务任务号 taskNo 由接入应用提供；原生设备任务号 N 由 WCS 分配并占用到安全收尾。</text>
<text x="60" y="1963" font-size="27" fill="#475c73" font-weight="400" text-anchor="start">图示为正常任务的典型交互；HTTP 返回代表受理，调度开始与响应返回可能并行。</text>
</g></svg>