<text x="20" y="539" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">4</text>
<rect x="1051.5" y="551" width="467" height="34" rx="4" fill="#ffffff"/>
<text x="1285" y="580" font-size="29" fill="#2e537d" font-weight="400" text-anchor="middle">新分配任务号前确认设备物理空闲</text>
