<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title description">
<title id="title">HTTP 到 OPC UA 堆垛机任务执行时序</title><desc id="description">当前代码正常任务流程：异步受理、按设备调度、原生任务号预约、参数写入、执行确认、轮询完成、先保存响应结果、完成确认、清零空闲、保存终态和释放任务号，最后查询或回调。</desc>
<defs>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2e537d"/></marker>
