<text x="20" y="981" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">10</text>
<rect x="699" y="1000" width="512" height="34" rx="4" fill="#ffffff"/>
<text x="955" y="1029" font-size="29" fill="#2e537d" font-weight="400" text-anchor="middle">先保存执行意图与任务版本，再写确认</text>
