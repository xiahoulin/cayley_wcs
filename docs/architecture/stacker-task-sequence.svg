<rect x="1052.5" y="1063" width="465" height="34" rx="4" fill="#ffffff"/>
<text x="1285" y="1092" font-size="29" fill="#d97016" font-weight="600" text-anchor="middle">执行确认点 cmd_ConfirmTask=1</text>
<line x1="1120" y1="1107" x2="1450" y2="1107" stroke="#d97016" stroke-width="2.7"  marker-end="url(#orange)"/>
<text x="20" y="1114" font-size="24" fill="#8797aa" font-weight="500" text-anchor="start">12</text>
<rect x="1033" y="1126" width="504" height="34" rx="4" fill="#ffffff"/>
<text x="1285" y="1155" font-size="29" fill="#237d87" font-weight="400" text-anchor="middle">设备受理：任务状态 status_Task=1</text>
<line x1="1450" y1="1170" x2="1120" y2="1170" stroke="#237d87" stroke-width="2.7" stroke-dasharray="8 5" marker-end="url(#teal)"/>
