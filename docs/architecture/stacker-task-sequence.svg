<marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237d87"/></marker>
</defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
