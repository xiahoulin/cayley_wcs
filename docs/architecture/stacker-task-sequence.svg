<rect x="30" y="362" width="575" height="34" rx="4" fill="#ffffff"/>
<text x="317.5" y="391" font-size="29" fill="#237d87" font-weight="400" text-anchor="middle">返回受理结果 errcode=0 与任务编号 id</text>
